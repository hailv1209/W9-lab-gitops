apiVersion: v1
kind: Namespace
metadata:
  name: dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-api
  namespace: dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-api-read-all
  namespace: dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: dashboard-api
    namespace: dashboard
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      serviceAccountName: dashboard-api
      containers:
        - name: api
          image: haile1209/dashboard-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NAMESPACE
              value: "demo"
            - name: PROM_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
            - name: ARGO_NS
              value: "argo-rollouts"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api
  namespace: dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: dashboard-api
