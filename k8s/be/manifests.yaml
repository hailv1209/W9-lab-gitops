apiVersion: v1
kind: ConfigMap
metadata:
  name: be-config
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  DB_HOST: "postgres.database.svc"
  DB_PORT: "5432"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: be-app
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  app.py: |
    from flask import Flask, jsonify
    import os
    import socket
    import time

    app = Flask(__name__)

    @app.route("/")
    def home():
        return jsonify({
            "message": "Hello from BE!",
            "hostname": socket.gethostname(),
            "timestamp": time.strftime("%Y-%m-%d %H:%M:%S")
        })

    @app.route("/api/greeting")
    def greeting():
        name = "World"
        return jsonify({
            "greeting": f"Hello, {name}!",
            "from": "BE Server",
            "hostname": socket.gethostname()
        })

    @app.route("/health")
    def health():
        return jsonify({"status": "ok"})

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
  requirements.txt: |
    flask==3.1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
    spec:
      containers:
        - name: be
          image: python:3.11-slim
          ports:
            - containerPort: 8080
          command: ["sh", "-c"]
          args:
            - pip install -q flask==3.1.0 && python /app/app.py
          envFrom:
            - configMapRef:
                name: be-config
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: be-app
---
apiVersion: v1
kind: Service
metadata:
  name: be
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: be
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
