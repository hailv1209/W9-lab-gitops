apiVersion: v1
kind: ConfigMap
metadata:
  name: be-config
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  DB_HOST: "postgres.database.svc"
  DB_PORT: "5432"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
    spec:
      containers:
        - name: be
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: be-config
---
apiVersion: v1
kind: Service
metadata:
  name: be
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: be
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
