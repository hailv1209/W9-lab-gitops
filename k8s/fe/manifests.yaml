apiVersion: v1
kind: ConfigMap
metadata:
  name: fe-config
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  NGINX_HOST: "frontend.example.com"
  NGINX_PORT: "80"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fe
  template:
    metadata:
      labels:
        app: fe
    spec:
      containers:
        - name: fe
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: fe-config
---
apiVersion: v1
kind: Service
metadata:
  name: fe
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: fe
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
