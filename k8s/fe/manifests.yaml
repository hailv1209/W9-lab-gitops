apiVersion: v1
kind: ConfigMap
metadata:
  name: fe-html
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="vi">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>FE App - GitOps</title>
      <style>
        body {
          margin: 0;
          font-family: 'Segoe UI', sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .card {
          background: white;
          border-radius: 16px;
          padding: 40px 60px;
          text-align: center;
          box-shadow: 0 20px 60px rgba(0,0,0,0.3);
          min-width: 400px;
        }
        .card h1 {
          color: #667eea;
          margin: 0 0 10px;
          font-size: 2.5em;
        }
        .card p {
          color: #555;
          margin: 0;
          font-size: 1.1em;
        }
        .badge {
          display: inline-block;
          background: #667eea;
          color: white;
          padding: 6px 16px;
          border-radius: 20px;
          margin-top: 20px;
          font-size: 0.9em;
        }
        button {
          margin-top: 25px;
          padding: 12px 30px;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
          border: none;
          border-radius: 8px;
          font-size: 1em;
          cursor: pointer;
          transition: transform 0.2s;
        }
        button:hover {
          transform: scale(1.05);
        }
        #result {
          margin-top: 20px;
          padding: 16px;
          background: #f0edff;
          border-radius: 10px;
          color: #333;
          font-size: 1.1em;
          min-height: 60px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #result.loading {
          color: #999;
          font-style: italic;
        }
        .info {
          font-size: 0.85em;
          color: #888;
          margin-top: 8px;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>FE App</h1>
        <p>Deployed via GitOps + ArgoCD</p>
        <span class="badge">Namespace: demo</span>

        <button onclick="callBE()">Call BE API</button>

        <div id="result">Click button to call BE</div>
        <div class="info">Calling: http://localhost:9999/api/greeting</div>
      </div>

      <script>
        async function callBE() {
          const el = document.getElementById('result');
          el.textContent = 'Calling BE...';
          el.className = 'loading';
          try {
            const res = await fetch('http://localhost:9999/api/greeting');
            const data = await res.json();
            el.className = '';
            el.innerHTML = '<strong>Greeting:</strong> ' + data.greeting +
              '<br><small>From: ' + data.from + ' | Host: ' + data.hostname + '</small>';
          } catch(e) {
            el.textContent = 'Error: ' + e.message;
            el.className = '';
          }
        }
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fe-config
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  NGINX_HOST: "frontend.example.com"
  NGINX_PORT: "80"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fe
  template:
    metadata:
      labels:
        app: fe
    spec:
      containers:
        - name: fe
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          envFrom:
            - configMapRef:
                name: fe-config
      volumes:
        - name: html
          configMap:
            name: fe-html
---
apiVersion: v1
kind: Service
metadata:
  name: fe
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: fe
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
