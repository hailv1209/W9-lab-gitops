# --- AnalysisTemplate: Đánh giá tự động chất lượng canary ---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-success-rate
  namespace: demo
spec:
  metrics:
    # Metric 1: Success Rate >= 95%
    # scalar() chuyển vector->scalar, tránh lỗi "mismatched types []float64 and float64"
    # or vector(1) ở cả tử số và mẫu số: khi không có traffic → 1/1 = 1.0 (100% success = PASS)
    - name: success-rate
      interval: 30s
      count: 5
      successCondition: result >= 0.95
      failureLimit: 2
      consecutiveErrorLimit: 5
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            scalar(
              sum(rate(flask_http_request_total{status!~"5..",app="api"}[2m]))
              or vector(1)
            )
            /
            scalar(
              sum(rate(flask_http_request_total{app="api"}[2m]))
              or vector(1)
            )

    # Metric 2: Error Rate < 5%
    # or vector(0) ở tử số: khi không có lỗi → 0/1 = 0.0 (0% error = PASS)
    - name: error-rate
      interval: 30s
      count: 5
      successCondition: result < 0.05
      failureLimit: 2
      consecutiveErrorLimit: 5
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            scalar(
              sum(rate(flask_http_request_total{status=~"5..",app="api"}[2m]))
              or vector(0)
            )
            /
            scalar(
              sum(rate(flask_http_request_total{app="api"}[2m]))
              or vector(1)
            )
