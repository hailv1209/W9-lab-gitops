# --- SLO & Alert: Giám sát chất lượng API ---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-slo-alerts
  namespace: demo
  labels:
    release: kube-prometheus-stack
    app: api
spec:
  groups:
    - name: api-slo
      interval: 30s
      rules:
        # SLO: API Success Rate phải >= 95% trong 5 phút
        - alert: APIHighErrorRate
          expr: |
            (
              sum(rate(flask_http_request_duration_seconds_count{path="/api/bug", status!~"5.."}[5m]))
              /
              sum(rate(flask_http_request_duration_seconds_count{path="/api/bug"}[5m]))
            ) < 0.95
          for: 30s                          # Fire sau 30s vi phạm liên tục (test: giảm từ 2m)
          labels:
            severity: critical
            team: backend
            slo: availability
            app: api
            service: api
          annotations:
            summary: "API Error Rate vượt ngưỡng SLO"
            description: |
              Success rate hiện tại: {{ $value | humanizePercentage }}
              Ngưỡng SLO: 95%
              
              API đang có tỷ lệ lỗi cao, cần kiểm tra ngay!
              
              Các bước khắc phục:
              1. Kiểm tra logs: kubectl logs -n demo -l app=api --tail=100
              2. Kiểm tra rollout: kubectl argo rollouts get rollout api -n demo
              3. Rollback nếu cần: git revert HEAD && git push
              
              Dashboard: http://grafana/d/api-metrics
            runbook_url: "https://wiki.company.com/runbook/api-high-error-rate"
        
        # SLO 2: Response Time p95 phải < 500ms (nếu có metrics)
        - alert: APIHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(flask_http_request_duration_seconds_bucket{path="/api/bug"}[5m])) by (le)
            ) > 0.5
          for: 1m                           # Fire sau 1 phút vi phạm liên tục (test: giảm từ 5m)
          labels:
            severity: warning
            team: backend
            slo: latency
            app: api
            service: api
          annotations:
            summary: "API Latency cao"
            description: |
              P95 latency: {{ $value }}s
              Ngưỡng SLO: 500ms
              
              API đang phản hồi chậm, có thể ảnh hưởng UX.

---
# --- AlertmanagerConfig: Gửi email khi alert fire ---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: api-email-alerts
  namespace: demo
  labels:
    alertmanagerConfig: main
spec:
  route:
    groupBy: ['alertname', 'severity']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h               # Gửi lại sau 12h nếu vẫn fire
    receiver: email-receiver
    matchers:
      - name: service
        value: api
        matchType: "="
  
  receivers:
    - name: email-receiver
      emailConfigs:
        - to: 'haileab542@gmail.com'  # ← THAY EMAIL CỦA BẠN TẠI ĐÂY
          from: 'alertmanager@cluster.local'
          smarthost: 'smtp.gmail.com:587'  # Hoặc SMTP server của bạn
          authUsername: 'demeter.web.design.22@gmail.com'   # ← THAY SMTP USERNAME
          authPassword:
            name: alertmanager-email-secret
            key: password
          requireTLS: true
          headers:
            - key: Subject
              value: '🚨 [{{ .GroupLabels.severity | toUpper }}] {{ .GroupLabels.alertname }}'
          text: |
            ⚠️ ALERT FIRED ⚠️
            
            Alert: {{ .GroupLabels.alertname }}
            Severity: {{ .GroupLabels.severity }}
            
            {{ range .Alerts }}
            ---
            Summary: {{ .Annotations.summary }}
            Description: {{ .Annotations.description }}
            Started at: {{ .StartsAt }}
            {{ end }}
            
            Dashboard: http://grafana/d/api-metrics

---
# --- Secret cho SMTP ---
# ⚠️ QUAN TRỌNG: Tạo secret này bằng lệnh kubectl trước khi apply file này
# 
# Bước 1: Tạo Gmail App Password
#   1. Vào: https://myaccount.google.com/apppasswords
#   2. Đăng nhập Gmail
#   3. Tạo App Password cho "Mail"
#   4. Copy password (16 ký tự, không có khoảng trắng)
#
# Bước 2: Tạo Secret
#   kubectl create secret generic alertmanager-email-secret \
#     -n demo \
#     --from-literal=password='your-16-char-app-password'
#
# Bước 3: Kiểm tra
#   kubectl get secret alertmanager-email-secret -n demo
#
# LƯU Ý: Không commit password vào Git!
# Secret này chỉ để tham khảo cấu trúc, tạo bằng kubectl thay vì apply file này.
