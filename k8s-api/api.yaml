# --- Rollout ---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: w9-api:1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ERROR_RATE
              value: "0"  # ERROR_RATE - Tỷ lệ lỗi giả lập (0-1)
            - name: VERSION
              value: "v3"  # VERSION - Version hiển thị trong response
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
  strategy:
    canary:
      # Canary tự động với AnalysisTemplate
      steps:
        - setWeight: 25                    # Bước 1: Chuyển 25% traffic sang canary
        - pause:
            duration: 30s                  # Chờ 30s để metrics ổn định
        - analysis:                        # Phân tích tự động
            templates:
              - templateName: api-success-rate
        - setWeight: 50                    # Nếu pass → 50% traffic
        - pause:
            duration: 30s
        - analysis:                        # Phân tích lần 2
            templates:
              - templateName: api-success-rate
        - setWeight: 100                   # Nếu pass → 100% (hoàn thành)
      
      # Tự động abort nếu analysis fail
      analysis:
        templates:
          - templateName: api-success-rate
        startingStep: 2                    # Bắt đầu từ step analysis đầu tiên
      
      # Tự động rollback về stable version khi abort
      abortScaleDownDelaySeconds: 30       # Chờ 30s trước khi scale down canary pods
      scaleDownDelaySeconds: 30            # Chờ 30s sau khi promote trước khi xóa old ReplicaSet

---
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: api

---
# --- ServiceMonitor ---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  namespace: demo
  labels:
    app: api
    release: prometheus  # match Prometheus Operator scrape label
spec:
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
